<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Verification System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
    <style>
        body {
            background-color: #2752ca;
            color: #1b55a8;
        }
        .main-card {
            background-color: #8ec5ff;
            border: 3px solid #519bea;
            border-radius: 15px;
            padding: 25px;
            max-width: 650px;
            margin: auto;
            box-shadow: 0 8px 24px #1100ff26;
        }
        h1 {
            color: #1b55a8;
            font-weight: bold;
            text-align: center;
            text-shadow: 1px 1px 2px #1a509d;
        }
        .custom-input {
            border: 2px solid #287aed;
            border-radius: 10px;
            background-color: #fff5f8;
        }
        .custom-input:focus {
            border-color: #287aed;
            background-color: #ffffff;
        }
        #output div {
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            padding: 10px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-weight: 500;
        }
        #message {
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }

    </style>
</head>
<body class="container mt-5">
    <div class="main-card">
        <h1>Communication Arts Club</h1>
        <p>Please enter the member's name verify if they have been accepted into the club:</p>

<input type="text" id="first_name" placeholder="Enter First Name" class="form-control mb-3">
<input type="text" id="last_name" placeholder="Enter Last Name" class="form-control mb-3">
<button type="button" class="btn btn-primary w-100 py-2 fw-bold" py-click="check_member">ENTER STUDENT</button>
    
<h3 class="mt-4">Communication Arts Members:</h3>
<div id="output"></div>
    
<p id="message"></p>

<footer class="text-center mt-4 pt-3 border-top text-muted">
    <small>© 2026 Communication Arts Club - Seatwork #1 - 2nd Quarter</small>
</footer>
</div>

<py-script src="main.py"></py-script>
</body>
</html>
